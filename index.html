<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SpaceLogo — استوديو الشعارات التفاعلي</title>
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;700&family=Inter:wght@400;600&family=Tajawal:wght@500;700&display=swap" rel="stylesheet">
  <style>
    :root { --accent: #ff6b35; --bg: #0a0a0f; }
    * { margin:0; padding:0; box-sizing:border-box; }
    body { font-family: 'Tajawal', 'Inter', sans-serif; background:#0a0a0f; color:#f5f5f7; }
    .hero { min-height:100vh; display:flex; align-items:center; justify-content:center; text-align:center; background:radial-gradient(ellipse at 30% 20%, rgba(255,107,53,0.25) 0%, transparent 50%), radial-gradient(ellipse at 70% 80%, rgba(0,212,255,0.15) 0%, #0a0a0f 70%); padding:40px 20px; }
    h1 { font-family:'Space Grotesk',sans-serif; font-size:clamp(3.5rem,8vw,6.5rem); font-weight:700; background:linear-gradient(90deg,#fff,#ff6b35); -webkit-background-clip:text; -webkit-text-fill-color:transparent; margin-bottom:16px; }
    p { font-size:1.3rem; color:#a0a0b0; max-width:600px; margin:0 auto 32px; }
    .cta { display:inline-block; background:linear-gradient(90deg,#ff6b35,#ff8c42); color:#fff; padding:16px 40px; border-radius:50px; text-decoration:none; font-weight:700; font-size:1.1rem; box-shadow:0 10px 40px rgba(255,107,53,0.4); transition:all 0.3s; }
    .cta:hover { transform:translateY(-3px); box-shadow:0 15px 50px rgba(255,107,53,0.5); }
  </style>
</head>
<body>
  <div class="hero">
    <div>
      <h1>SpaceLogo</h1>
      <p>استوديو شعارات فضائية تفاعلية ثلاثية الأبعاد — بتصميم داكن أنيق مع لمسات برتقالية.</p>
      <a href="tool.html" class="cta">ابدأ التصميم الآن</a>
    </div>
  </div>
</body>
</html>
